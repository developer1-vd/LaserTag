# Flatpak build of Laser Tag. Build and install locally with:
#   flatpak-builder --user --install-deps-from=flathub --install --force-clean \
#     build-flatpak packaging/flatpak/io.github.developer1_vd.LaserTag.yml
app-id: io.github.developer1_vd.LaserTag
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: lasertag
finish-args:
  # Java's window toolkit (AWT) speaks X11; on Wayland desktops it runs through XWayland.
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Sound effects.
  - --socket=pulseaudio
  # Online play: hosting, joining, LAN game discovery and opening the router port (UPnP).
  - --share=network

modules:
  # A Java runtime with only the modules the game uses (about 50 MB instead of a full JDK).
  - name: jre
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/bin/jlink
        --add-modules java.base,java.desktop,java.prefs,java.net.http,jdk.crypto.ec
        --strip-debug --no-man-pages --no-header-files --compress=zip-6
        --output /app/jre

  - name: lasertag
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk21/bin
    build-commands:
      - mkdir -p build/classes
      - javac --release 17 -encoding UTF-8 -d build/classes $(find src/main/java -name '*.java')
      - jar --create --file build/lasertag.jar --main-class lasertag.LaserTag -C build/classes .
      - install -Dm644 build/lasertag.jar /app/lib/lasertag/lasertag.jar
      - install -Dm755 packaging/flatpak/lasertag.sh /app/bin/lasertag
      - install -Dm644 packaging/linux/io.github.developer1_vd.LaserTag.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/io.github.developer1_vd.LaserTag.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/linux/io.github.developer1_vd.LaserTag.png /app/share/icons/hicolor/256x256/apps/io.github.developer1_vd.LaserTag.png
    sources:
      # The checkout this manifest sits in. (A Flathub submission would point at a git tag instead.)
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - dist
          - web/target
          - build-flatpak
          - .flatpak-builder
