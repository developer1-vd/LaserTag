name: Build

# Every push and pull request: run the tests on Windows, macOS and Linux, and build the
# Java-bundled apps for each. Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B test

  package:
    name: Package (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS-AppleSilicon
          - os: macos-15-intel
            label: macOS-Intel
          # Oldest supported Ubuntu, so the .deb installs on older distros as well as newer ones.
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Install WiX (for the .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Build packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            java packaging/Package.java --strict --version "${GITHUB_REF_NAME#v}"
          else
            java packaging/Package.java --strict
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LaserTag-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every OS build makes the same cross-platform jar; merging the artifacts keeps one copy.
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Laser Tag ${{ github.ref_name }}" \
            --generate-notes
